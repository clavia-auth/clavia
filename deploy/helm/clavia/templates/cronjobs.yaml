{{- range .Values.schedules }}
---
# bin/clavia {{ .command }}, on "{{ .schedule }}".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clavia.fullname" $ }}-{{ .name }}
  labels:
    {{- include "clavia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "clavia.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: {{ .name }}
        spec:
          restartPolicy: Never
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            {{- include "clavia.commandContainer" (dict "root" $ "command" .command) | nindent 12 }}
{{- end }}
