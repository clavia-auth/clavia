# The production Caddyfile (files/Caddyfile), the same one deploy/compose mounts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clavia.fullname" . }}-caddy
  labels:
    {{- include "clavia.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {{- .Files.Get "files/Caddyfile" | nindent 4 }}
