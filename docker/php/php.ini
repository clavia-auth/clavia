; Errors go to the log, never to a response: an identity provider's stack trace is
; not something to hand a client, in development either.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

expose_php = Off

; Development: pick up edited files immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
