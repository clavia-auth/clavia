openapi: 3.0.3
info:
  title: Clavia authorization server
  # This document's own version; the server release is shown beside it on the published reference.
  version: '1'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  description: |
    The endpoints an application or an API calls on `auth.{domain}`: OAuth 2.1 and OpenID Connect,
    as Clavia implements them. The flows themselves (how PKCE is verified, what a grant means, how a
    DPoP proof is built) are the RFCs'; each operation links the section it follows, and says what is
    Clavia's: which client authentication, which grants, which refusals, which limits.

    **Bodies are forms.** Every request to these endpoints is `application/x-www-form-urlencoded`
    (RFC 6749 §3.2), and every answer JSON. A parameter sent twice is refused (RFC 6749 §3.1); one the
    endpoint does not know is ignored.

    **Clients authenticate one way per request**, the way they were registered
    (`token_endpoint_auth_method`):
    - `client_secret_basic`: HTTP Basic, the client id and secret, each form-encoded first (RFC 6749 §2.3.1);
    - `client_secret_post`: `client_id` and `client_secret` in the body;
    - `none`: a public client names itself with `client_id` alone, and proves itself with PKCE or DPoP.

    Methods are never tried in turn, and mixing them is refused. Every failure is the same `401
    invalid_client`.

    **Failures are limited.** Past `CLAVIA_TOKEN_MAX_FAILURES` failed client authentications or
    refused grants from one address (and, once it proved itself, for one client) within
    `CLAVIA_TOKEN_FAILURE_WINDOW`, these endpoints answer `429` before looking at the request.

    **Refusals** are RFC 6749 §5.2 error documents: `error`, and `error_description` for a person
    reading logs. Branch on `error`, never on the description. No refusal repeats a secret or the
    value at fault, and nothing these endpoints answer may be cached (`Cache-Control: no-store`).

    This document describes the server; it does not drive it. The acceptance suite checks every
    answer of these endpoints against it.

servers:
  - url: /

tags:
  - name: tokens
    x-displayName: Tokens
    description: Getting tokens (RFC 6749 §3.2), and asking ahead for an authorization (RFC 9126).
  - name: token-management
    x-displayName: Token management
    description: What a client or an API learns about a token, or gives back (RFC 7662, RFC 7009).
  - name: devices
    x-displayName: Devices
    description: Signing in on a device with no browser, or no keyboard (RFC 8628).
  - name: browser
    x-displayName: Browser
    description: |
      Where an application sends the person's browser: to sign in and authorize (RFC 6749 §4.1.1,
      OpenID Connect Core §3.1.2), and to sign out (OpenID Connect RP-Initiated Logout 1.0). These are
      navigations, not calls: they answer with redirects and pages.
  - name: openid-connect
    x-displayName: OpenID Connect
    description: What a relying party reads about the person, and about this server (OpenID Connect Core §5.3, Discovery 1.0, RFC 8414).
  - name: registration
    x-displayName: Registration
    description: |
      Clients registering themselves with an initial access token (RFC 7591), and managing their
      registration (RFC 7592). Only when the deployment sets `CLAVIA_CLIENT_REGISTRATION=token`;
      otherwise these paths do not exist.

paths:
  /oauth2/token:
    post:
      tags: [tokens]
      summary: Get a token
      operationId: getToken
      description: |
        Exchanges a grant for tokens (RFC 6749 §3.2): an authorization code, a refresh token, the
        client's own credentials, or a device code. The body depends on `grant_type`; the client
        authenticates as it was registered, and may only use the grants it holds.

        - **Authorization code** (RFC 6749 §4.1.3, OAuth 2.1 §4.1.3): the code is spent before its
          `redirect_uri` and `code_verifier` are checked, so a wrong guess burns it. A code redeemed
          twice revokes everything it issued. With `openid` in its scope, the answer carries an ID token.
        - **Refresh token** (RFC 6749 §6): every refresh spends the token and returns a new one; a
          spent token presented again revokes its whole family. `scope` may narrow, never widen.
        - **Client credentials** (RFC 6749 §4.4): a confidential client asking as itself, for one API
          named in `audience`, within its grant there. No refresh token.
        - **Device code** (RFC 8628 §3.4): polled every `interval` seconds until the person decides.

        **DPoP** (RFC 9449): with a `DPoP` header holding a proof, the tokens are bound to its key
        (`token_type: DPoP`). The server asks for its nonce first (`use_dpop_nonce`, with `DPoP-Nonce`),
        and sends the next one with each answer. A client registered with `dpop_bound_access_tokens`
        must send a proof.
      security:
        - clientSecretBasic: []
        - {}
      parameters:
        - $ref: '#/components/parameters/DPoP'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrant'
                - $ref: '#/components/schemas/RefreshTokenGrant'
                - $ref: '#/components/schemas/ClientCredentialsGrant'
                - $ref: '#/components/schemas/DeviceCodeGrant'
            examples:
              AuthorizationCodeGrant:
                $ref: '#/components/examples/AuthorizationCodeGrant'
              RefreshTokenGrant:
                $ref: '#/components/examples/RefreshTokenGrant'
              ClientCredentialsGrant:
                $ref: '#/components/examples/ClientCredentialsGrant'
              DeviceCodeGrant:
                $ref: '#/components/examples/DeviceCodeGrant'
      responses:
        '200':
          description: The tokens.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
            DPoP-Nonce:
              $ref: '#/components/headers/DPoPNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                CodeTokens:
                  $ref: '#/components/examples/CodeTokens'
                MachineToken:
                  $ref: '#/components/examples/MachineToken'
        '400':
          description: |
            The request is refused (RFC 6749 §5.2): `invalid_request` (a parameter missing, repeated or
            malformed), `invalid_grant` (a code, refresh token or device code that is unknown, spent,
            expired, someone else's, or whose `redirect_uri` or `code_verifier` does not match),
            `unauthorized_client` (a grant the client does not hold), `unsupported_grant_type`,
            `invalid_scope` (a scope beyond the client's grant, or a wider one at a refresh),
            `invalid_target` (an unknown `audience`), `access_denied`, the device flow's
            `authorization_pending`, `slow_down` and `expired_token` (RFC 8628 §3.5), and DPoP's
            `invalid_dpop_proof` and `use_dpop_nonce` (with `DPoP-Nonce`).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
            DPoP-Nonce:
              $ref: '#/components/headers/DPoPNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                InvalidGrant:
                  $ref: '#/components/examples/InvalidGrant'
                AuthorizationPending:
                  $ref: '#/components/examples/AuthorizationPending'
                UseDpopNonce:
                  $ref: '#/components/examples/UseDpopNonce'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '429':
          $ref: '#/components/responses/TooManyFailures'
        '500':
          $ref: '#/components/responses/ServerError'

  /oauth2/par:
    post:
      tags: [tokens]
      summary: Push an authorization request
      operationId: pushAuthorizationRequest
      description: |
        Sends an authorization request over the back channel (RFC 9126 §2.1) and gets a handle for it,
        `request_uri`, to send the browser to `/oauth2/authorize` with instead (`client_id` and
        `request_uri` only). The parameters never reach the address bar, and the request is checked
        here, before anyone signs in.

        The body is an authorization request, held to the authorization endpoint's rules, from the
        client that will use it, authenticated as at the token endpoint. A `request_uri` inside it is
        refused. The handle is good for `expires_in` seconds (`CLAVIA_PAR_LIFETIME`) and yields one code.

        With a `DPoP` header, the code it yields is bound to the proof's key; a `dpop_jkt` naming
        another key is `invalid_dpop_proof`.
      security:
        - clientSecretBasic: []
        - {}
      parameters:
        - $ref: '#/components/parameters/DPoP'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PushedAuthorizationRequest'
            examples:
              PushedAuthorizationRequest:
                $ref: '#/components/examples/PushedAuthorizationRequest'
      responses:
        '201':
          description: The request is held behind `request_uri`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
            DPoP-Nonce:
              $ref: '#/components/headers/DPoPNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushedAuthorizationResponse'
              examples:
                PushedAuthorizationResponse:
                  $ref: '#/components/examples/PushedAuthorizationResponse'
        '400':
          description: |
            The request is refused (RFC 9126 §2.3, RFC 6749 §4.1.2.1): `invalid_request`,
            `unauthorized_client`, `unsupported_response_type`, `invalid_scope`, `invalid_target`,
            `access_denied` (a third-party application asking for a system API), `request_not_supported`
            and `request_uri_not_supported` (request objects), and DPoP's `invalid_dpop_proof` and
            `use_dpop_nonce` (with `DPoP-Nonce`).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
            DPoP-Nonce:
              $ref: '#/components/headers/DPoPNonce'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushedAuthorizationError'
              examples:
                InvalidRequest:
                  $ref: '#/components/examples/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '429':
          $ref: '#/components/responses/TooManyFailures'
        '500':
          $ref: '#/components/responses/ServerError'

  /oauth2/introspect:
    post:
      tags: [token-management]
      summary: Introspect a token
      operationId: introspectToken
      description: |
        Tells an API whether a token is live, and what it carries (RFC 7662 §2). For a JWT access
        token too: a JWT and its introspection agree when issued, and introspection then follows
        revocation and later changes.

        Only a client authenticating **with a secret** may ask, and only about a token it has a stake
        in: one issued to it, or one for an API it holds a grant on. Everything else (an unknown,
        expired or revoked token, or somebody else's) is `{"active": false}`, never an error.
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenReference'
            examples:
              TokenReference:
                $ref: '#/components/examples/TokenReference'
      responses:
        '200':
          description: 'What the token is, or `active: false`.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Introspection'
              examples:
                ActiveToken:
                  $ref: '#/components/examples/ActiveToken'
                InactiveToken:
                  $ref: '#/components/examples/InactiveToken'
        '400':
          description: |
            The request is refused: `invalid_request` (no `token`, or a parameter repeated).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenManagementError'
              examples:
                InvalidRequest:
                  $ref: '#/components/examples/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '429':
          $ref: '#/components/responses/TooManyFailures'
        '500':
          $ref: '#/components/responses/ServerError'

  /oauth2/revoke:
    post:
      tags: [token-management]
      summary: Revoke a token
      operationId: revokeToken
      description: |
        Gives back a token the client no longer needs (RFC 7009 §2.1). Any client may revoke a token
        issued to it, a public one by its `client_id`. A refresh token takes its whole family along; an
        access token goes alone (an API that validates a JWT on its own accepts it until it expires).

        A token the server does not know is a quiet `200` (RFC 7009 §2.2). `token_type_hint` says where
        to look first, never where to look only.
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenReference'
            examples:
              TokenReference:
                $ref: '#/components/examples/TokenReference'
      responses:
        '200':
          description: Revoked, or unknown. No body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
        '400':
          description: |
            The request is refused: `invalid_request` (no `token`, or a parameter repeated),
            `invalid_grant` (a token issued to another client), `unsupported_token_type`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenManagementError'
              examples:
                RevokedElsewhere:
                  $ref: '#/components/examples/RevokedElsewhere'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '429':
          $ref: '#/components/responses/TooManyFailures'
        '500':
          $ref: '#/components/responses/ServerError'

  /oauth2/device/code:
    post:
      tags: [devices]
      summary: Sign in a device
      operationId: startDeviceAuthorization
      description: |
        Starts the device flow (RFC 8628 §3.1): the device shows `user_code` and `verification_uri`
        (or a QR code of `verification_uri_complete`), the person approves on another screen, and
        the device polls `/oauth2/token` with `device_code` every `interval` seconds.

        The client must hold the device grant. The request is held to the authorization endpoint's
        rules for `scope` and `audience`.
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
            examples:
              DeviceAuthorizationRequest:
                $ref: '#/components/examples/DeviceAuthorizationRequest'
      responses:
        '200':
          description: The codes, and where the person goes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorization'
              examples:
                DeviceAuthorization:
                  $ref: '#/components/examples/DeviceAuthorization'
        '400':
          description: |
            The request is refused: `invalid_request`, `unauthorized_client` (a client without the
            device grant), `invalid_scope`, `invalid_target`, `access_denied`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Pragma:
              $ref: '#/components/headers/Pragma'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationError'
              examples:
                UnauthorizedClient:
                  $ref: '#/components/examples/UnauthorizedClient'
        '401':
          $ref: '#/components/responses/InvalidClient'
        '429':
          $ref: '#/components/responses/TooManyFailures'
        '500':
          $ref: '#/components/responses/ServerError'

  /oauth2/authorize:
    get:
      tags: [browser]
      summary: Authorize
      operationId: authorize
      description: |
        Where an application sends the person's browser to sign in and authorize it (RFC 6749 §4.1.1,
        OAuth 2.1 §4.1.1, OpenID Connect Core §3.1.2.1). Not a call: the browser follows redirects and
        sees pages.

        The order is fixed:
        1. **The client and the redirect URI** are settled, or the request is refused here, never
           redirected (`400`, a page for a browser, the error document for a program). Redirect URIs
           match registered ones exactly.
        2. **A pushed request** (RFC 9126): `client_id` and `request_uri` alone stand for what was pushed
           to `/oauth2/par`. A client registered with `require_pushed_authorization_requests` must push.
        3. **Everything else is validated**: a repeated parameter, a request object (`request`, any other
           `request_uri`), the response type, PKCE (S256 only), scope, `audience`, `prompt`, `max_age`.
           These refusals go **to the redirect URI**, with `state` and `iss` (RFC 9207).
        4. **The person**: with no session, or one that does not meet `prompt`, `max_age` or the levels
           asked for (`acr_values`, the client's and the API's MFA policy), the browser goes to the
           sign-in page (`303`), and comes back here when done. `prompt=none` answers `login_required`
           or `interaction_required` instead.
        5. **Roles and consent**: somebody with no role on an API that enforces them gets
           `access_denied`; a request that needs consent goes to the consent screen (`303`).
        6. **The code** goes to the redirect URI (`302`) with `state` and `iss`. It is good once, briefly,
           for this client, this redirect URI and this PKCE challenge.
      parameters:
        - {$ref: '#/components/parameters/ResponseType'}
        - {$ref: '#/components/parameters/ClientId'}
        - {$ref: '#/components/parameters/RedirectUri'}
        - {$ref: '#/components/parameters/AuthorizationScope'}
        - {$ref: '#/components/parameters/State'}
        - {$ref: '#/components/parameters/CodeChallenge'}
        - {$ref: '#/components/parameters/CodeChallengeMethod'}
        - {$ref: '#/components/parameters/Audience'}
        - {$ref: '#/components/parameters/Nonce'}
        - {$ref: '#/components/parameters/Prompt'}
        - {$ref: '#/components/parameters/MaxAge'}
        - {$ref: '#/components/parameters/AcrValues'}
        - {$ref: '#/components/parameters/DpopJkt'}
        - {$ref: '#/components/parameters/RequestUri'}
      responses:
        '302':
          $ref: '#/components/responses/ToTheClient'
        '303':
          $ref: '#/components/responses/WithinTheServer'
        '400':
          $ref: '#/components/responses/AuthorizationRefused'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [browser]
      summary: Authorize by form
      operationId: authorizeByForm
      description: |
        The same request as a form posted by the browser (OpenID Connect Core §3.1.2.1): the parameters
        in the body instead of the query, decided exactly as `GET /oauth2/authorize` decides them.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
            examples:
              AuthorizationRequest:
                $ref: '#/components/examples/AuthorizationRequest'
      responses:
        '302':
          $ref: '#/components/responses/ToTheClient'
        '303':
          $ref: '#/components/responses/WithinTheServer'
        '400':
          $ref: '#/components/responses/AuthorizationRefused'
        '500':
          $ref: '#/components/responses/ServerError'

  /oidc/logout:
    get:
      tags: [browser]
      summary: Sign out
      operationId: endSession
      description: |
        Where an application sends the browser to end the person's session (OpenID Connect
        RP-Initiated Logout 1.0 §2).

        The session ends at once when `id_token_hint` is an ID token this server signed (with a
        published key, retired ones included; its expiry is not checked) for the session's person.
        Anything less shows a confirmation page, whose form posts back here with `confirmed=yes`. Then
        the browser goes to `post_logout_redirect_uri`, when it is one the client registered (exactly,
        with `state`), or to the sign-in page. Every application signed in through the session is told
        by back-channel logout, when it registered for it.
      parameters:
        - {$ref: '#/components/parameters/IdTokenHint'}
        - {$ref: '#/components/parameters/PostLogoutRedirectUri'}
        - {$ref: '#/components/parameters/LogoutState'}
        - {$ref: '#/components/parameters/LogoutClientId'}
      responses:
        '200':
          $ref: '#/components/responses/Page'
        '302':
          $ref: '#/components/responses/AfterSignOut'
        '303':
          $ref: '#/components/responses/AfterSignOut'
        '400':
          $ref: '#/components/responses/Page'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [browser]
      summary: Sign out by form
      operationId: endSessionByForm
      description: |
        The same request as a form, and the confirmation page's answer (`confirmed=yes`), which only
        a POST carries.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EndSessionRequest'
            examples:
              EndSessionRequest:
                $ref: '#/components/examples/EndSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Page'
        '302':
          $ref: '#/components/responses/AfterSignOut'
        '303':
          $ref: '#/components/responses/AfterSignOut'
        '400':
          $ref: '#/components/responses/Page'
        '500':
          $ref: '#/components/responses/ServerError'

  /oidc/userinfo:
    get:
      tags: [openid-connect]
      summary: Get the person's claims
      operationId: getUserInfo
      description: |
        What the access token lets the application know about the person (OpenID Connect Core §5.3):
        `sub`, and the claims the token's scopes release (`profile`, `email`), then the application's
        custom claims meant for userinfo. A claim with no value is left out, never null.

        The token comes in the `Authorization` header only: `Bearer`, or `DPoP` with a proof when it
        is bound (RFC 9449 §7). It must be live, for a person (a machine token describes nobody), and
        carry `openid`.
      security:
        - accessToken: []
        - dpopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DPoP'
      responses:
        '200':
          $ref: '#/components/responses/UserInfo'
        '400':
          $ref: '#/components/responses/BearerRefused'
        '401':
          $ref: '#/components/responses/BearerRefused'
        '403':
          $ref: '#/components/responses/BearerRefused'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [openid-connect]
      summary: Get the person's claims by POST
      operationId: postUserInfo
      description: The same as `GET`, for clients that prefer POST (OpenID Connect Core §5.3.1). No body is read.
      security:
        - accessToken: []
        - dpopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DPoP'
      responses:
        '200':
          $ref: '#/components/responses/UserInfo'
        '400':
          $ref: '#/components/responses/BearerRefused'
        '401':
          $ref: '#/components/responses/BearerRefused'
        '403':
          $ref: '#/components/responses/BearerRefused'
        '500':
          $ref: '#/components/responses/ServerError'

  /oidc/jwks.json:
    get:
      tags: [openid-connect]
      summary: Get the signing keys
      operationId: getJwks
      description: |
        The public keys tokens are signed with (RFC 7517 §5): the active key and the retired ones whose
        tokens may still be live. Pick a key by the token's `kid`, and the algorithm by the key's `alg`,
        never the token's header. A token with an unknown `kid` is a reason to fetch this again, once.
      responses:
        '200':
          description: The key set. Cacheable for a short while.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'
              examples:
                JwkSet:
                  $ref: '#/components/examples/JwkSet'
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/openid-configuration:
    get:
      tags: [openid-connect]
      summary: Get the discovery document
      operationId: getOpenIdConfiguration
      description: |
        This server's metadata (OpenID Connect Discovery 1.0 §4): its endpoints and what it supports. It
        names only what exists (`registration_endpoint` only when registration is on), and states every
        value whose default would mislead.
      responses:
        '200':
          $ref: '#/components/responses/Metadata'

  /.well-known/oauth-authorization-server:
    get:
      tags: [openid-connect]
      summary: Get the server metadata
      operationId: getAuthorizationServerMetadata
      description: The same document under RFC 8414 §3's name, for OAuth clients that look there.
      responses:
        '200':
          $ref: '#/components/responses/Metadata'

  /oauth2/register:
    post:
      tags: [registration]
      summary: Register a client
      operationId: registerClient
      description: |
        A client registers itself (RFC 7591 §3.1), holding an initial access token an operator issued.
        The client is always third-party (a `tpc_` id), so it never reaches a system API, and people are
        asked for their consent. It holds the code grant, and the refresh grant if it asks; it
        authenticates with `client_secret_basic` (the default), `client_secret_post` or `none`.

        In order: the client address is counted (`CLAVIA_CLIENT_REGISTRATION_MAX_PER_ADDRESS` per
        `CLAVIA_CLIENT_REGISTRATION_WINDOW`, `429` past it); the initial access token is checked; the
        metadata is read. A refused registration spends no use of the token. The answer carries the
        client secret and the registration access token, once.
      security:
        - initialAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientMetadata'
            examples:
              ClientMetadata:
                $ref: '#/components/examples/ClientMetadata'
      responses:
        '201':
          description: Registered. The secrets are shown once.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredClient'
              examples:
                RegisteredClient:
                  $ref: '#/components/examples/RegisteredClient'
        '400':
          $ref: '#/components/responses/RegistrationRefused'
        '401':
          $ref: '#/components/responses/BearerRefused'
        '404':
          $ref: '#/components/responses/RegistrationOff'
        '429':
          $ref: '#/components/responses/TooManyRegistrations'
        '500':
          $ref: '#/components/responses/ServerError'

  /oauth2/register/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    get:
      tags: [registration]
      summary: Read a registration
      operationId: readRegistration
      description: |
        The client's metadata, without its secret (RFC 7592 §2.1), to the registration access token of
        this client only. Rotates nothing.
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: The client's metadata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfiguration'
              examples:
                ClientConfiguration:
                  $ref: '#/components/examples/ClientConfiguration'
        '400':
          $ref: '#/components/responses/BearerRefused'
        '401':
          $ref: '#/components/responses/BearerRefused'
        '404':
          $ref: '#/components/responses/RegistrationOff'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [registration]
      summary: Update a registration
      operationId: updateRegistration
      description: |
        Replaces the client's metadata (RFC 7592 §2.2), held to the registration's rules: every member
        stated, one left out taking its default (leave out `grant_types` and the refresh grant goes).
        The body names `client_id`; it may not name the server's own members
        (`registration_access_token`, `registration_client_uri`, `client_secret_expires_at`,
        `client_id_issued_at`), a `client_secret` other than the current one, or another client type.

        The answer carries a **new registration access token**: the old one stops working at once. The
        id, the secret and the operator's settings stay.
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientMetadataUpdate'
            examples:
              ClientMetadataUpdate:
                $ref: '#/components/examples/ClientMetadataUpdate'
      responses:
        '200':
          description: Updated, with the new registration access token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfiguration'
              examples:
                UpdatedClientConfiguration:
                  $ref: '#/components/examples/UpdatedClientConfiguration'
        '400':
          $ref: '#/components/responses/RegistrationRefused'
        '401':
          $ref: '#/components/responses/BearerRefused'
        '404':
          $ref: '#/components/responses/RegistrationOff'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [registration]
      summary: Delete a registration
      operationId: deleteRegistration
      description: The client deletes itself (RFC 7592 §2.3).
      security:
        - registrationAccessToken: []
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BearerRefused'
        '401':
          $ref: '#/components/responses/BearerRefused'
        '404':
          $ref: '#/components/responses/RegistrationOff'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    clientSecretBasic:
      type: http
      scheme: basic
      description: |
        `client_secret_basic` (RFC 6749 §2.3.1): the client id as the user name and the secret as the
        password, each form-encoded before they are joined. A client registered for
        `client_secret_post` or `none` sends no `Authorization` header: its `client_id` (and
        `client_secret`) are body fields, and this requirement is then the empty one.
    accessToken:
      type: http
      scheme: bearer
      description: An access token (RFC 6750 §2.1), in the `Authorization` header only.
    dpopAccessToken:
      type: http
      scheme: DPoP
      description: A DPoP-bound access token (RFC 9449 §7.1), with a proof for this request in `DPoP`.
    initialAccessToken:
      type: http
      scheme: bearer
      description: An initial access token (RFC 7591 §3), issued by an operator. Never a DPoP token.
    registrationAccessToken:
      type: http
      scheme: bearer
      description: The registration access token of this client (RFC 7592 §3), from its registration or its last update.

  parameters:
    ResponseType:
      name: response_type
      in: query
      required: true
      description: '`code`: the only response type (OAuth 2.1 §4.1.1).'
      schema: {type: string, enum: [code]}
    ClientId:
      name: client_id
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 64}
    RedirectUri:
      name: redirect_uri
      in: query
      description: One of the client's registered redirect URIs, exactly. Required unless the client registered only one.
      schema: {type: string}
    AuthorizationScope:
      name: scope
      in: query
      description: Space-separated scopes; `openid` for an ID token.
      schema: {$ref: '#/components/schemas/Scope'}
    State:
      name: state
      in: query
      description: Sent back unchanged to the redirect URI.
      schema: {type: string}
    CodeChallenge:
      name: code_challenge
      in: query
      description: The base64url SHA-256 of the PKCE verifier (RFC 7636 §4.2).
      schema: {type: string, minLength: 43, maxLength: 43}
    CodeChallengeMethod:
      name: code_challenge_method
      in: query
      description: '`S256`, the only method: `plain` does not exist here.'
      schema: {type: string, enum: [S256]}
    Audience:
      name: audience
      in: query
      description: The identifier of the API whose permissions the scope may hold. Unknown is `invalid_target`.
      schema: {type: string}
    Nonce:
      name: nonce
      in: query
      description: Copied into the ID token (OpenID Connect Core §3.1.2.1).
      schema: {type: string}
    Prompt:
      name: prompt
      in: query
      description: '`none`, `login`, `consent` or `select_account`, space-separated (OpenID Connect Core §3.1.2.1).'
      schema: {type: string}
    MaxAge:
      name: max_age
      in: query
      description: Seconds since the person last signed in, at most; older asks them again.
      schema: {type: string, pattern: '^[0-9]+$'}
    AcrValues:
      name: acr_values
      in: query
      description: Levels of authentication, space-separated, any one accepted (OpenID Connect Core §3.1.2.1).
      schema: {type: string}
    DpopJkt:
      name: dpop_jkt
      in: query
      description: The thumbprint of the key the code is bound to (RFC 9449 §10).
      schema: {type: string}
    RequestUri:
      name: request_uri
      in: query
      description: The handle `/oauth2/par` answered (RFC 9126 §4), with `client_id` alone.
      schema: {type: string, pattern: '^urn:ietf:params:oauth:request_uri:'}
    IdTokenHint:
      name: id_token_hint
      in: query
      description: An ID token this server issued for the session's person; with it, no confirmation is asked.
      schema: {type: string}
    PostLogoutRedirectUri:
      name: post_logout_redirect_uri
      in: query
      description: Where to send the browser after, if the client registered it exactly.
      schema: {type: string}
    LogoutState:
      name: state
      in: query
      description: Sent back to `post_logout_redirect_uri`.
      schema: {type: string}
    LogoutClientId:
      name: client_id
      in: query
      description: The client, when no `id_token_hint` names it.
      schema: {type: string}
    DPoP:
      name: DPoP
      in: header
      description: |
        A DPoP proof (RFC 9449 §4): a JWT of type `dpop+jwt`, signed with ES256, EdDSA or RS256 by the
        key the tokens are to be bound to, for this request's method and URL, at most a minute old,
        and carrying the server's nonce. One proof per request, one header.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'

  headers:
    PublicCache:
      description: Public, for an hour; the key rotation's grace covers it.
      required: true
      schema:
        type: string
        pattern: '^public, max-age=[0-9]+$'
    NoStore:
      description: Not to be stored.
      required: true
      schema:
        type: string
        enum: [no-store]
    BearerChallenge:
      description: |
        RFC 6750 §3: the scheme the token was refused in (`Bearer`, or `DPoP` with the algorithms
        accepted), this server's realm, and the error when a token was sent.
      required: true
      schema:
        type: string
        pattern: '^(Bearer|DPoP) realm="[^"]+"'
    CacheControl:
      description: Nothing these endpoints answer may be stored (RFC 6749 §5.1).
      required: true
      schema:
        type: string
        enum: [no-store]
    Pragma:
      description: For HTTP/1.0 caches (RFC 6749 §5.1).
      required: true
      schema:
        type: string
        enum: [no-cache]
    Location:
      description: Where the browser goes next.
      required: true
      schema:
        type: string
        minLength: 1
    DPoPNonce:
      description: The nonce the client's next DPoP proof must carry (RFC 9449 §8).
      schema:
        type: string
        minLength: 1
    RetryAfter:
      description: Seconds to wait before trying again.
      required: true
      schema:
        type: integer
        minimum: 1
    BasicChallenge:
      description: The client authentication scheme, and this server's realm, its issuer.
      required: true
      schema:
        type: string
        pattern: '^Basic realm="[^"]+"$'

  responses:
    ToTheClient:
      description: |
        To the client's redirect URI (RFC 6749 §4.1.2), with `code`, `state` and `iss`; or a refusal,
        with `error`, `error_description`, `state` and `iss` (RFC 6749 §4.1.2.1, RFC 9207).
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    WithinTheServer:
      description: |
        To a page of this server (`/auth/login`, `/auth/consent`, `/auth/mfa`), which comes back here once
        the person has done what it asks. The request waits behind an opaque handle; nothing of it is in
        the address.
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    AuthorizationRefused:
      description: |
        The client or its redirect URI cannot be trusted, so nothing is redirected (RFC 6749 §4.1.2.1):
        a page for a person, the error document for a program. Also an unknown, expired or another
        client's `request_uri`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
          examples:
            UnknownClient:
              $ref: '#/components/examples/UnknownClient'
        text/html:
          schema:
            type: string
            format: binary
    Page:
      description: A page for the person (a confirmation, or a refusal), never for a program to read.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        text/html:
          schema:
            type: string
            format: binary
          example: '<!doctype html><html lang="en"><title>Sign out?</title>…</html>'
    AfterSignOut:
      description: Signed out; to `post_logout_redirect_uri` with `state`, or to the sign-in page.
      headers:
        Location:
          $ref: '#/components/headers/Location'
    UserInfo:
      description: The person's claims.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserInfo'
          examples:
            UserInfo:
              $ref: '#/components/examples/UserInfo'
    BearerRefused:
      description: |
        The token is refused (RFC 6750 §3, RFC 9449 §7.1): `400 invalid_request` (credentials that
        cannot be read), `401 invalid_token`, `401 invalid_dpop_proof`, `403 insufficient_scope`. With
        no credentials at all, a bare `401` and an empty object.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/BearerChallenge'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BearerError'
          examples:
            InvalidToken:
              $ref: '#/components/examples/InvalidToken'
    Metadata:
      description: The metadata. Cacheable for an hour.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PublicCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderMetadata'
          examples:
            ProviderMetadata:
              $ref: '#/components/examples/ProviderMetadata'
    RegistrationRefused:
      description: |
        The metadata is refused (RFC 7591 §3.2.2), the member at fault named, never its value:
        `invalid_redirect_uri`, `invalid_client_metadata`, `invalid_software_statement`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationError'
          examples:
            InvalidRedirectUri:
              $ref: '#/components/examples/InvalidRedirectUri'
    RegistrationOff:
      description: Registration is off on this deployment (`CLAVIA_CLIENT_REGISTRATION=off`), so the path does not exist.
      content:
        application/json:
          schema:
            type: object
          example:
            detail: Not Found
        text/html:
          schema:
            type: string
            format: binary
    TooManyRegistrations:
      description: Too many registrations from this address. Nothing was looked at; wait `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TemporarilyUnavailableError'
          examples:
            TooManyRegistrations:
              $ref: '#/components/examples/TooManyRegistrations'
    InvalidClient:
      description: |
        The client did not authenticate (RFC 6749 §5.2): an unknown client, a wrong secret, a method
        other than the one it registered, two methods at once, or none where one is needed. One
        answer for every reason.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/BasicChallenge'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Pragma:
          $ref: '#/components/headers/Pragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidClientError'
          examples:
            InvalidClient:
              $ref: '#/components/examples/InvalidClient'
    TooManyFailures:
      description: |
        Too many failed requests from this address, or for this client (RFC 6585 §4). Nothing was
        looked at; wait `Retry-After` seconds. RFC 6749 has no code for this at these endpoints: the
        authorization endpoint's `temporarily_unavailable` says it.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Pragma:
          $ref: '#/components/headers/Pragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TemporarilyUnavailableError'
          examples:
            TooManyFailures:
              $ref: '#/components/examples/TooManyFailures'
    ServerError:
      description: |
        An unexpected failure, a signing failure among them (RFC 6749 §5.2 has no code for it). Nothing
        was spent: retry. The server's log holds the details under `X-Error-Reference`. The body says
        nothing more: `Internal Server Error` in plain text, or a page for a browser.
      headers:
        X-Error-Reference:
          description: Twelve characters naming the failure in the server's log.
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{12}$'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/plain:
          schema:
            type: string
            format: binary
          example: Internal Server Error
        text/html:
          schema:
            type: string
            format: binary

  schemas:
    ClientAuthentication:
      description: |
        The body's part of client authentication: `client_id` alone for a public client (`none`), with
        `client_secret` for `client_secret_post`. A client using HTTP Basic sends neither.
      type: object
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's id. Required unless the client authenticates with HTTP Basic.
        client_secret:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: The client's secret, for `client_secret_post` only.

    Scope:
      type: string
      description: Space-separated scopes (RFC 6749 §3.3).
      pattern: '^[\x21\x23-\x5B\x5D-\x7E]+( [\x21\x23-\x5B\x5D-\x7E]+)*$'

    AuthorizationCodeGrant:
      title: Authorization code
      description: Redeems an authorization code (RFC 6749 §4.1.3, with PKCE, RFC 7636 §4.5).
      allOf:
        - $ref: '#/components/schemas/ClientAuthentication'
        - type: object
          required: [grant_type, code, redirect_uri]
          properties:
            grant_type:
              type: string
              enum: [authorization_code]
            code:
              type: string
              minLength: 1
              description: The code `/oauth2/authorize` sent to the redirect URI. Good once.
            redirect_uri:
              type: string
              minLength: 1
              description: The redirect URI of the authorization request, exactly.
            code_verifier:
              type: string
              minLength: 43
              maxLength: 128
              pattern: '^[A-Za-z0-9._~-]+$'
              writeOnly: true
              description: |
                The PKCE verifier whose S256 challenge the authorization request carried. Required
                but for a confidential client registered with `require_pkce: false` that sent a
                `nonce` instead (OAuth 2.1 §7.5.1).

    RefreshTokenGrant:
      title: Refresh token
      description: Swaps a refresh token for new tokens (RFC 6749 §6).
      allOf:
        - $ref: '#/components/schemas/ClientAuthentication'
        - type: object
          required: [grant_type, refresh_token]
          properties:
            grant_type:
              type: string
              enum: [refresh_token]
            refresh_token:
              type: string
              minLength: 1
              writeOnly: true
              description: The latest refresh token of the family. Spent by this request.
            scope:
              allOf:
                - $ref: '#/components/schemas/Scope'
              description: Fewer scopes than were authorized, for this access token only.

    ClientCredentialsGrant:
      title: Client credentials
      description: A confidential client asks as itself (RFC 6749 §4.4).
      allOf:
        - $ref: '#/components/schemas/ClientAuthentication'
        - type: object
          required: [grant_type, audience]
          properties:
            grant_type:
              type: string
              enum: [client_credentials]
            audience:
              type: string
              minLength: 1
              description: The identifier of the API the token is for. Required.
            scope:
              allOf:
                - $ref: '#/components/schemas/Scope'
              description: |
                Some of the client's grant on that API; the whole grant when left out. Beyond it is
                `invalid_scope`, never narrowed. `openid` is refused.

    DeviceCodeGrant:
      title: Device code
      description: Polls for the person's decision (RFC 8628 §3.4).
      allOf:
        - $ref: '#/components/schemas/ClientAuthentication'
        - type: object
          required: [grant_type, device_code]
          properties:
            grant_type:
              type: string
              enum: ['urn:ietf:params:oauth:grant-type:device_code']
            device_code:
              type: string
              minLength: 1
              writeOnly: true
              description: The `device_code` `/oauth2/device/code` answered.

    TokenResponse:
      description: The tokens (RFC 6749 §5.1).
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: |
            Opaque, or an RFC 9068 JWT (`typ: at+jwt`) when the API takes JWTs. Pass it on; don't
            read it.
        token_type:
          type: string
          enum: [Bearer, DPoP]
          description: '`DPoP` when the token is bound to the key of the request''s proof.'
        expires_in:
          type: integer
          minimum: 1
          description: Seconds until the access token expires.
        scope:
          allOf:
            - $ref: '#/components/schemas/Scope'
          description: What the token carries, which may be less than was asked. Absent when none.
        refresh_token:
          type: string
          description: |
            For an authorization code or a refresh, when the client holds the refresh grant. Replaces
            the one sent; the old one is spent.
        id_token:
          type: string
          description: For an authorization code whose scope had `openid`. Never at a refresh.

    PushedAuthorizationRequest:
      description: |
        An authorization request (RFC 6749 §4.1.1, OpenID Connect Core §3.1.2.1), as
        `/oauth2/authorize` would take it, and the client's authentication.
      allOf:
        - $ref: '#/components/schemas/ClientAuthentication'
        - type: object
          required: [response_type, redirect_uri, code_challenge, code_challenge_method]
          properties:
            response_type:
              type: string
              enum: [code]
            redirect_uri:
              type: string
              minLength: 1
              description: One of the client's registered redirect URIs, exactly.
            scope:
              $ref: '#/components/schemas/Scope'
            state:
              type: string
              description: Sent back unchanged with the code.
            code_challenge:
              type: string
              minLength: 43
              maxLength: 43
              description: The base64url SHA-256 of the PKCE verifier.
            code_challenge_method:
              type: string
              enum: [S256]
            audience:
              type: string
              description: The identifier of the API whose permissions the scope may hold.
            nonce:
              type: string
              description: Copied into the ID token (OpenID Connect Core §3.1.2.1).
            prompt:
              type: string
              description: '`none`, `login`, `consent` or `select_account`, space-separated.'
            max_age:
              type: string
              pattern: '^[0-9]+$'
              description: Seconds since the person last signed in, at most.
            acr_values:
              type: string
              description: The levels of authentication asked for, any one accepted.
            dpop_jkt:
              type: string
              description: The thumbprint of the key the code is to be bound to (RFC 9449 §10).

    PushedAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [request_uri, expires_in]
      properties:
        request_uri:
          type: string
          pattern: '^urn:ietf:params:oauth:request_uri:[A-Za-z0-9_-]+$'
          description: The handle to send to `/oauth2/authorize`, with `client_id`.
        expires_in:
          type: integer
          minimum: 1
          description: Seconds the handle is good for.

    TokenReference:
      description: The token in question (RFC 7662 §2.1, RFC 7009 §2.1).
      allOf:
        - $ref: '#/components/schemas/ClientAuthentication'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              minLength: 1
              writeOnly: true
            token_type_hint:
              type: string
              enum: [access_token, refresh_token]
              description: Where to look first.

    Introspection:
      description: |
        RFC 7662 §2.2. Inactive is `{"active": false}` and nothing else. An active token's custom
        claims, configured on its API, follow the members below.
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        client_id:
          type: string
        scope:
          type: string
        iss:
          type: string
        iat:
          type: integer
        exp:
          type: integer
        token_type:
          type: string
          enum: [Bearer, DPoP]
        aud:
          type: string
          description: The API the token is for. Absent for a token for no API.
        sub:
          type: string
          description: The person, or the client acting as itself.
        username:
          type: string
          description: The person's address.
        auth_time:
          type: integer
          description: When the person signed in (RFC 9470 §6.2).
        acr:
          type: string
          description: The level of that sign-in, when it had more than one factor.
        cnf:
          type: object
          additionalProperties: false
          required: [jkt]
          properties:
            jkt:
              type: string
              description: The thumbprint of the key a DPoP-bound token is bound to (RFC 9449 §6.2).

    DeviceAuthorizationRequest:
      description: The device's request (RFC 8628 §3.1).
      allOf:
        - $ref: '#/components/schemas/ClientAuthentication'
        - type: object
          properties:
            scope:
              $ref: '#/components/schemas/Scope'
            audience:
              type: string
              description: The identifier of the API whose permissions the scope may hold.

    DeviceAuthorization:
      type: object
      additionalProperties: false
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
          description: For the device to poll `/oauth2/token` with. Never shown.
        user_code:
          type: string
          pattern: '^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$'
          description: For the person to type; consonants only, so it spells nothing.
        verification_uri:
          type: string
          description: Where the person goes to type it.
        verification_uri_complete:
          type: string
          description: The same, with the code in it, for a QR code.
        expires_in:
          type: integer
          minimum: 1
        interval:
          type: integer
          minimum: 1
          description: Seconds between polls; `slow_down` adds five for good.

    TokenError:
      allOf:
        - $ref: '#/components/schemas/OAuthError'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_request
                - invalid_grant
                - unauthorized_client
                - unsupported_grant_type
                - invalid_scope
                - invalid_target
                - access_denied
                - authorization_pending
                - slow_down
                - expired_token
                - invalid_dpop_proof
                - use_dpop_nonce

    PushedAuthorizationError:
      allOf:
        - $ref: '#/components/schemas/OAuthError'
        - type: object
          properties:
            error:
              type: string
              enum:
                - invalid_request
                - unauthorized_client
                - unsupported_response_type
                - invalid_scope
                - invalid_target
                - access_denied
                - request_not_supported
                - request_uri_not_supported
                - invalid_dpop_proof
                - use_dpop_nonce

    TokenManagementError:
      allOf:
        - $ref: '#/components/schemas/OAuthError'
        - type: object
          properties:
            error:
              type: string
              enum: [invalid_request, invalid_grant, unsupported_token_type]

    DeviceAuthorizationError:
      allOf:
        - $ref: '#/components/schemas/OAuthError'
        - type: object
          properties:
            error:
              type: string
              enum: [invalid_request, unauthorized_client, invalid_scope, invalid_target, access_denied]

    InvalidClientError:
      allOf:
        - $ref: '#/components/schemas/OAuthError'
        - type: object
          properties:
            error:
              type: string
              enum: [invalid_client]

    TemporarilyUnavailableError:
      allOf:
        - $ref: '#/components/schemas/OAuthError'
        - type: object
          properties:
            error:
              type: string
              enum: [temporarily_unavailable]

    AuthorizationRequest:
      description: An authorization request as a form (OpenID Connect Core §3.1.2.1), the query's parameters.
      type: object
      required: [client_id]
      properties:
        response_type: {type: string, enum: [code]}
        client_id: {type: string, minLength: 1, maxLength: 64}
        redirect_uri: {type: string}
        scope: {$ref: '#/components/schemas/Scope'}
        state: {type: string}
        code_challenge: {type: string, minLength: 43, maxLength: 43}
        code_challenge_method: {type: string, enum: [S256]}
        audience: {type: string}
        nonce: {type: string}
        prompt: {type: string}
        max_age: {type: string, pattern: '^[0-9]+$'}
        acr_values: {type: string}
        dpop_jkt: {type: string}
        request_uri: {type: string}

    EndSessionRequest:
      description: An RP-Initiated Logout request as a form, or the confirmation page's answer.
      type: object
      properties:
        id_token_hint: {type: string}
        post_logout_redirect_uri: {type: string}
        state: {type: string}
        client_id: {type: string}
        confirmed:
          type: string
          enum: ['yes']
          description: The confirmation page's answer; read from a POST only.
        csrf_token:
          type: string
          description: The confirmation page's own field.

    UserInfo:
      description: |
        `sub`, then the claims the token's scopes release (OpenID Connect Core §5.1), then the
        application's custom claims for userinfo. A claim without a value is left out.
      type: object
      required: [sub]
      properties:
        sub: {type: string}
        email: {type: string}
        email_verified: {type: boolean}
        name: {type: string}
        given_name: {type: string}
        family_name: {type: string}
        nickname: {type: string}
        picture: {type: string}
        locale: {type: string}
        updated_at: {type: integer}

    BearerError:
      description: An RFC 6750 §3 error, or RFC 9449's; an empty object when no credentials came.
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_token, insufficient_scope, invalid_dpop_proof]
        error_description: {type: string}

    JwkSet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

    Jwk:
      description: A public key (RFC 7517 §4), named by its RFC 7638 thumbprint.
      type: object
      required: [kty, kid, use, alg]
      properties:
        kty: {type: string, enum: [RSA, EC, OKP]}
        kid: {type: string}
        use: {type: string, enum: [sig]}
        alg: {type: string}
        n: {type: string}
        e: {type: string}
        crv: {type: string}
        x: {type: string}
        y: {type: string}

    ProviderMetadata:
      description: |
        OpenID Connect Discovery 1.0 §3 and RFC 8414 §2. Endpoints this deployment does not have are left
        out (`registration_endpoint` when registration is off).
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - code_challenge_methods_supported
      properties:
        issuer: {type: string}
        authorization_endpoint: {type: string}
        token_endpoint: {type: string}
        userinfo_endpoint: {type: string}
        jwks_uri: {type: string}
        registration_endpoint: {type: string}
        end_session_endpoint: {type: string}
        introspection_endpoint: {type: string}
        revocation_endpoint: {type: string}
        device_authorization_endpoint: {type: string}
        pushed_authorization_request_endpoint: {type: string}
        require_pushed_authorization_requests: {type: boolean}
        scopes_supported: {type: array, items: {type: string}}
        response_types_supported: {type: array, items: {type: string, enum: [code]}}
        response_modes_supported: {type: array, items: {type: string}}
        grant_types_supported:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - refresh_token
              - client_credentials
              - 'urn:ietf:params:oauth:grant-type:device_code'
        acr_values_supported: {type: array, items: {type: string}}
        subject_types_supported: {type: array, items: {type: string}}
        id_token_signing_alg_values_supported: {type: array, items: {type: string}}
        token_endpoint_auth_methods_supported:
          type: array
          items: {$ref: '#/components/schemas/ClientAuthMethod'}
        introspection_endpoint_auth_methods_supported:
          type: array
          items: {$ref: '#/components/schemas/SecretClientAuthMethod'}
        revocation_endpoint_auth_methods_supported:
          type: array
          items: {$ref: '#/components/schemas/ClientAuthMethod'}
        dpop_signing_alg_values_supported:
          type: array
          items: {type: string, enum: [ES256, EdDSA, RS256]}
        claim_types_supported: {type: array, items: {type: string}}
        claims_supported: {type: array, items: {type: string}}
        prompt_values_supported: {type: array, items: {type: string}}
        claims_parameter_supported: {type: boolean}
        request_parameter_supported: {type: boolean}
        request_uri_parameter_supported: {type: boolean}
        code_challenge_methods_supported: {type: array, items: {type: string, enum: [S256]}}
        authorization_response_iss_parameter_supported: {type: boolean}
        backchannel_logout_supported: {type: boolean}
        backchannel_logout_session_supported: {type: boolean}

    ClientAuthMethod:
      type: string
      enum: [client_secret_basic, client_secret_post, none]

    SecretClientAuthMethod:
      description: The methods with a secret, the only ones introspection takes.
      type: string
      enum: [client_secret_basic, client_secret_post]

    ClientMetadata:
      description: |
        What a self-registering client may say (RFC 7591 §2). Anything else, the operator's settings
        included, is ignored and left out of the answer.
      type: object
      required: [client_name, redirect_uris]
      properties:
        client_name: {type: string, minLength: 1, maxLength: 120}
        redirect_uris:
          type: array
          minItems: 1
          items: {type: string}
          description: https without a fragment; a public client may use http on 127.0.0.1 or [::1], never localhost.
        post_logout_redirect_uris: {type: array, items: {type: string}}
        grant_types:
          type: array
          items: {type: string, enum: [authorization_code, refresh_token]}
          description: '`authorization_code` alone by default.'
        response_types: {type: array, items: {type: string, enum: [code]}}
        token_endpoint_auth_method: {$ref: '#/components/schemas/ClientAuthMethod'}
        backchannel_logout_uri: {type: string, description: An https URL on a public address.}
        backchannel_logout_session_required: {type: boolean}
        dpop_bound_access_tokens: {type: boolean}

    ClientMetadataUpdate:
      description: The whole metadata again (RFC 7592 §2.2), naming the client.
      allOf:
        - $ref: '#/components/schemas/ClientMetadata'
        - type: object
          required: [client_id]
          properties:
            client_id: {type: string}
            client_secret:
              type: string
              description: The current secret, if sent at all; any other is refused.

    ClientConfiguration:
      description: The client as registered (RFC 7592 §3), without its secret.
      type: object
      required: [client_id, client_id_issued_at, registration_client_uri, client_name, token_endpoint_auth_method, grant_types, response_types, redirect_uris]
      properties:
        client_id: {type: string, pattern: '^tpc_'}
        client_id_issued_at: {type: integer}
        registration_access_token:
          type: string
          description: After an update only, and once.
        registration_client_uri: {type: string}
        client_name: {type: string}
        token_endpoint_auth_method: {$ref: '#/components/schemas/ClientAuthMethod'}
        grant_types: {type: array, items: {type: string}}
        response_types: {type: array, items: {type: string}}
        redirect_uris: {type: array, items: {type: string}}
        post_logout_redirect_uris: {type: array, items: {type: string}}
        backchannel_logout_uri: {type: string}
        backchannel_logout_session_required: {type: boolean}
        dpop_bound_access_tokens: {type: boolean}

    RegisteredClient:
      description: The client just registered (RFC 7591 §3.2.1), its secrets shown once.
      allOf:
        - $ref: '#/components/schemas/ClientConfiguration'
        - type: object
          required: [registration_access_token]
          properties:
            client_secret:
              type: string
              description: Absent for a public client (`none`).
            client_secret_expires_at:
              type: integer
              enum: [0]
              description: Never; sent with a secret only.

    RegistrationError:
      allOf:
        - $ref: '#/components/schemas/OAuthError'
        - type: object
          properties:
            error:
              type: string
              enum: [invalid_redirect_uri, invalid_client_metadata, invalid_software_statement]

    OAuthError:
      description: An RFC 6749 §5.2 error document.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: The code to branch on.
        error_description:
          type: string
          description: For a person reading logs. Never repeats the value at fault.

  examples:
    AuthorizationCodeGrant:
      summary: An authorization code, by a public client
      value:
        grant_type: authorization_code
        client_id: "Xk7pQ2mN9vR4tL8wC3yB6hJ1dF5gS0aE"
        code: "example-authorization-code-not-real-0000000"
        redirect_uri: "https://reports.example.com/callback"
        code_verifier: "example-pkce-verifier-not-real-000000000000000"
    RefreshTokenGrant:
      summary: A refresh, narrowed to one scope
      value:
        grant_type: refresh_token
        refresh_token: "example-refresh-token-not-real-000000000000"
        scope: "read:reports"
    ClientCredentialsGrant:
      summary: A machine token for the Reports API
      value:
        grant_type: client_credentials
        audience: "https://api.example.com/reports"
        scope: "read:reports"
    DeviceCodeGrant:
      summary: A device polling
      value:
        grant_type: "urn:ietf:params:oauth:grant-type:device_code"
        client_id: "Xk7pQ2mN9vR4tL8wC3yB6hJ1dF5gS0aE"
        device_code: "example-device-code-not-real-0000000000000"
    CodeTokens:
      summary: An OpenID Connect sign-in's tokens
      value:
        token_type: Bearer
        access_token: "example-access-token-not-real-0000000000000"
        expires_in: 3600
        scope: "openid email read:reports"
        refresh_token: "example-refresh-token-not-real-000000000000"
        id_token: "example.id-token.not-real"
    MachineToken:
      summary: A DPoP-bound machine token
      value:
        token_type: DPoP
        access_token: "example-access-token-not-real-0000000000000"
        expires_in: 3600
        scope: "read:reports"
    InvalidGrant:
      summary: A code spent, expired, or not this client's
      value:
        error: invalid_grant
        error_description: "The authorization code is invalid, expired, or was issued to another client."
    AuthorizationPending:
      summary: The person has not decided yet
      value:
        error: authorization_pending
        error_description: "The user has not yet approved or denied the request."
    UseDpopNonce:
      summary: The server's nonce is needed
      value:
        error: use_dpop_nonce
        error_description: "The DPoP proof must carry the server's nonce."
    InvalidClient:
      summary: The client did not authenticate
      value:
        error: invalid_client
        error_description: "Client authentication failed."
    TooManyFailures:
      summary: Too many failures
      value:
        error: temporarily_unavailable
        error_description: "Too many failed requests. Retry later."
    PushedAuthorizationRequest:
      summary: A sign-in with Acme Reports
      value:
        client_id: "Xk7pQ2mN9vR4tL8wC3yB6hJ1dF5gS0aE"
        response_type: code
        redirect_uri: "https://reports.example.com/callback"
        scope: "openid email read:reports"
        audience: "https://api.example.com/reports"
        state: "af0ifjsldkj"
        nonce: "n-0S6_WzA2Mj"
        code_challenge: "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
        code_challenge_method: S256
    PushedAuthorizationResponse:
      summary: The handle
      value:
        request_uri: "urn:ietf:params:oauth:request_uri:example-handle-not-real-00000"
        expires_in: 60
    InvalidRequest:
      summary: A parameter missing or repeated
      value:
        error: invalid_request
        error_description: "The 'redirect_uri' parameter is required."
    TokenReference:
      summary: A token, by an API
      value:
        token: "example-access-token-not-real-0000000000000"
        token_type_hint: access_token
    ActiveToken:
      summary: Ada's token for the Reports API
      value:
        active: true
        client_id: "Xk7pQ2mN9vR4tL8wC3yB6hJ1dF5gS0aE"
        scope: "read:reports"
        iss: "https://auth.example.com"
        iat: 1768471200
        exp: 1768474800
        token_type: Bearer
        aud: "https://api.example.com/reports"
        sub: "3f8e2d1c-5b4a-4c9e-8d7f-6a5b4c3d2e1f"
        username: "ada@example.com"
        auth_time: 1768471100
        acr: "http://schemas.openid.net/pape/policies/2007/06/multi-factor"
    InactiveToken:
      summary: Unknown, expired, revoked, or not yours
      value:
        active: false
    RevokedElsewhere:
      summary: Another client's token
      value:
        error: invalid_grant
        error_description: "The token was issued to another client."
    DeviceAuthorizationRequest:
      summary: A television asking to sign in
      value:
        client_id: "Xk7pQ2mN9vR4tL8wC3yB6hJ1dF5gS0aE"
        scope: "openid read:reports"
        audience: "https://api.example.com/reports"
    DeviceAuthorization:
      summary: What the television shows
      value:
        device_code: "example-device-code-not-real-0000000000000"
        user_code: "BCDF-GHJK"
        verification_uri: "https://auth.example.com/auth/device"
        verification_uri_complete: "https://auth.example.com/auth/device?user_code=BCDF-GHJK"
        expires_in: 600
        interval: 5
    UnauthorizedClient:
      summary: A client without the device grant
      value:
        error: unauthorized_client
        error_description: "The client is not allowed to use the device authorization grant."

    AuthorizationRequest:
      summary: A sign-in with Acme Reports, as a form
      value:
        response_type: code
        client_id: "Xk7pQ2mN9vR4tL8wC3yB6hJ1dF5gS0aE"
        redirect_uri: "https://reports.example.com/callback"
        scope: "openid email read:reports"
        state: "af0ifjsldkj"
        nonce: "n-0S6_WzA2Mj"
        code_challenge: "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
        code_challenge_method: S256
    UnknownClient:
      summary: A client or redirect URI not to be trusted
      value:
        error: invalid_request
        error_description: "The redirect URI is not registered for this client."
    EndSessionRequest:
      summary: Signing out of Acme Reports
      value:
        id_token_hint: "example.id-token.not-real"
        post_logout_redirect_uri: "https://reports.example.com/"
        state: "4bAq7"
    UserInfo:
      summary: Ada, with the email scope
      value:
        sub: "3f8e2d1c-5b4a-4c9e-8d7f-6a5b4c3d2e1f"
        email: "ada@example.com"
        email_verified: true
    InvalidToken:
      summary: An unusable token
      value:
        error: invalid_token
        error_description: "The access token is expired, revoked, or not valid."
    JwkSet:
      summary: One RSA key
      value:
        keys:
          - kty: RSA
            kid: "fv1yLZeJTloEHvzxRvLo7zNUgn1x5tWR02z73c2qDsg"
            use: sig
            alg: RS256
            n: "example-modulus-not-a-real-key"
            e: "AQAB"
    ProviderMetadata:
      summary: This server's metadata
      value:
        issuer: "https://auth.example.com"
        authorization_endpoint: "https://auth.example.com/oauth2/authorize"
        token_endpoint: "https://auth.example.com/oauth2/token"
        userinfo_endpoint: "https://auth.example.com/oidc/userinfo"
        jwks_uri: "https://auth.example.com/oidc/jwks.json"
        end_session_endpoint: "https://auth.example.com/oidc/logout"
        introspection_endpoint: "https://auth.example.com/oauth2/introspect"
        revocation_endpoint: "https://auth.example.com/oauth2/revoke"
        device_authorization_endpoint: "https://auth.example.com/oauth2/device/code"
        pushed_authorization_request_endpoint: "https://auth.example.com/oauth2/par"
        require_pushed_authorization_requests: false
        scopes_supported: [openid, profile, email, offline_access]
        response_types_supported: [code]
        grant_types_supported:
          - authorization_code
          - refresh_token
          - client_credentials
          - 'urn:ietf:params:oauth:grant-type:device_code'
        token_endpoint_auth_methods_supported: [client_secret_basic, client_secret_post, none]
        code_challenge_methods_supported: [S256]
        dpop_signing_alg_values_supported: [ES256, EdDSA, RS256]
        id_token_signing_alg_values_supported: [RS256]
        subject_types_supported: [public]
        authorization_response_iss_parameter_supported: true
    ClientMetadata:
      summary: Acme Reports registering itself
      value:
        client_name: "Acme Reports"
        redirect_uris: ["https://reports.acme.example/callback"]
        grant_types: [authorization_code, refresh_token]
    RegisteredClient:
      summary: Registered, with its secrets
      value:
        client_id: "tpc_iK0Bks4PODSlxzzSwo1zaKKRgd8ZZOtz"
        client_secret: "example-client-secret-not-real-0000000000000"
        client_secret_expires_at: 0
        client_id_issued_at: 1768471200
        registration_access_token: "example-registration-token-not-real-0000000"
        registration_client_uri: "https://auth.example.com/oauth2/register/tpc_iK0Bks4PODSlxzzSwo1zaKKRgd8ZZOtz"
        client_name: "Acme Reports"
        token_endpoint_auth_method: client_secret_basic
        grant_types: [authorization_code, refresh_token]
        response_types: [code]
        redirect_uris: ["https://reports.acme.example/callback"]
        dpop_bound_access_tokens: false
    ClientConfiguration:
      summary: The client as registered
      value:
        client_id: "tpc_iK0Bks4PODSlxzzSwo1zaKKRgd8ZZOtz"
        client_id_issued_at: 1768471200
        registration_client_uri: "https://auth.example.com/oauth2/register/tpc_iK0Bks4PODSlxzzSwo1zaKKRgd8ZZOtz"
        client_name: "Acme Reports"
        token_endpoint_auth_method: client_secret_basic
        grant_types: [authorization_code, refresh_token]
        response_types: [code]
        redirect_uris: ["https://reports.acme.example/callback"]
        dpop_bound_access_tokens: false
    ClientMetadataUpdate:
      summary: A second redirect URI
      value:
        client_id: "tpc_iK0Bks4PODSlxzzSwo1zaKKRgd8ZZOtz"
        client_name: "Acme Reports"
        redirect_uris: ["https://reports.acme.example/callback", "https://reports.acme.example/v2/callback"]
        grant_types: [authorization_code, refresh_token]
    UpdatedClientConfiguration:
      summary: Updated, with a new registration access token
      value:
        client_id: "tpc_iK0Bks4PODSlxzzSwo1zaKKRgd8ZZOtz"
        client_id_issued_at: 1768471200
        registration_access_token: "example-registration-token-not-real-1111111"
        registration_client_uri: "https://auth.example.com/oauth2/register/tpc_iK0Bks4PODSlxzzSwo1zaKKRgd8ZZOtz"
        client_name: "Acme Reports"
        token_endpoint_auth_method: client_secret_basic
        grant_types: [authorization_code, refresh_token]
        response_types: [code]
        redirect_uris: ["https://reports.acme.example/callback", "https://reports.acme.example/v2/callback"]
        dpop_bound_access_tokens: false
    InvalidRedirectUri:
      summary: A redirect URI the rules refuse
      value:
        error: invalid_redirect_uri
        error_description: "Each of 'redirect_uris' must be https without a fragment, or, for a public client, http on 127.0.0.1 or [::1]."
    TooManyRegistrations:
      summary: Too many registrations
      value:
        error: temporarily_unavailable
        error_description: "Too many registrations. Retry later."
