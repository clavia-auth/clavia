# Clavia as it is deployed, for the end-to-end suites (docs/design/end-to-end-scenarios.md): the
# production topology of deploy/compose, with the application built from this checkout, the
# production Caddyfile (with test certificates, see up.sh) and nothing published beyond 127.0.0.1.
#
#   test/e2e/up.sh      the certificate, the stack, the development data
#   test/e2e/down.sh    stop it and forget its data
#
# Not a deployment: the settings in e2e.env are throwaways, and the data is seeded by `seed-dev`.

name: clavia-e2e

x-clavia: &clavia
  # Built from this checkout, unless CLAVIA_E2E_IMAGE names one to run as it is (the dashboard's workflow runs
  # ghcr.io/clavia-auth/clavia:edge): up.sh then builds nothing.
  image: ${CLAVIA_E2E_IMAGE:-clavia-e2e:local}
  env_file: [e2e.env]
  networks: [clavia]

services:
  # The application, built from this checkout as a release builds it (docker/php, target production).
  php:
    <<: *clavia
    build:
      context: ../../docker/php
      additional_contexts:
        app: ../..
      target: production
    # Clavia calls out to the applications it signs people in to (a back-channel logout, a webhook): on the
    # `edge` network the names of the stack are Caddy, as they are for the dashboard, and the CA of the stack's
    # certificate is the one it trusts for those calls (the only ones it makes here).
    networks: [clavia, edge]
    volumes:
      - ./.work/rootCA.pem:/ca/rootCA.pem:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-e2e.ini:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      openfga:
        condition: service_healthy

  migrate:
    <<: *clavia
    command: ["php", "bin/clavia", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  assets:
    <<: *clavia
    # The image's public/ into the volume Caddy serves, as in production.
    command: ["sh", "-c", "rm -rf /shared/* && cp -a /app/public/. /shared/"]
    volumes:
      - public:/shared

  # The scheduled commands, every two seconds (scheduler.sh): it sends the webhook deliveries, so like php it
  # calls out to the stack's own names and trusts its CA.
  scheduler:
    <<: *clavia
    command: ["sh", "/opt/clavia/scheduler.sh"]
    volumes:
      - ./scheduler.sh:/opt/clavia/scheduler.sh:ro
      - ./.work/rootCA.pem:/ca/rootCA.pem:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-e2e.ini:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${CLAVIA_E2E_HTTP_PORT:-80}:80"
      - "127.0.0.1:${CLAVIA_E2E_HTTPS_PORT:-443}:443"
    environment:
      CLAVIA_ROOT_DOMAIN: clavia.test
      CLAVIA_PHP_FASTCGI: php:9000
      CLAVIA_DASHBOARD_UPSTREAM: dashboard:3000
    volumes:
      # The production Caddyfile with a `tls` line in each of its two https sites (up.sh makes it).
      - ./.work/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.work/certs:/etc/caddy/certs:ro
      - public:/app/public:ro
    depends_on:
      assets:
        condition: service_completed_successfully
      php:
        condition: service_started
    networks:
      clavia:
      # As in production: the names a server-side caller (the dashboard) reaches Clavia by are Caddy.
      edge:
        aliases:
          - auth.clavia.test
          - management.clavia.test
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The mail server: Clavia sends through SMTP as in production, and the suites read what arrived through
  # Mailpit's HTTP API. Nothing is relayed anywhere.
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:${CLAVIA_E2E_MAIL_PORT:-8025}:8025"
    networks: [clavia]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The dashboard, behind Caddy at /dashboard as in production: it reaches Clavia by the names Caddy answers
  # to on the `edge` network. Off unless asked for (CLAVIA_E2E_DASHBOARD=1, see up.sh), so a run that does not
  # test it does not pull it. CLAVIA_E2E_DASHBOARD_IMAGE names another image, such as one built from a pull
  # request. The published images, `:edge` included, are for linux/amd64 and linux/arm64 from 0.6.1.
  dashboard:
    profiles: [dashboard]
    image: ${CLAVIA_E2E_DASHBOARD_IMAGE:-ghcr.io/clavia-auth/clavia-dashboard:edge}
    env_file: [dashboard.env]
    volumes:
      - ./.work/rootCA.pem:/ca/rootCA.pem:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [clavia, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dashboard/signed-out').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Where a webhook is delivered to, for a suite that registers one: it keeps what it is sent and lists it on a
  # port published on this machine (receiver.mjs). Off unless asked for (CLAVIA_E2E_RECEIVER=1, see up.sh).
  receiver:
    profiles: [receiver]
    image: node:22-alpine
    command: ["node", "/app/receiver.mjs"]
    ports:
      - "127.0.0.1:${CLAVIA_E2E_RECEIVER_PORT:-8026}:8026"
    volumes:
      - ./receiver.mjs:/app/receiver.mjs:ro
      - ./.work/certs:/certs:ro
    networks:
      clavia:
        aliases:
          - receiver.clavia.test
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8026/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clavia
      POSTGRES_PASSWORD: clavia
      POSTGRES_DB: clavia
    # Nothing to keep between runs.
    tmpfs:
      - /var/lib/postgresql/data
    networks: [clavia]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clavia -d clavia"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    networks: [clavia]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OpenFGA, the decision engine of fine-grained authorization, as docker-compose.yml runs it: beside Clavia
  # with its own database (docs/design/fine-grained-authorization.md §2), reached by Clavia alone with the
  # preshared key of e2e.env, published on no port, every cache off so every answer is strongly consistent.
  openfga-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    # Nothing to keep between runs.
    tmpfs:
      - /var/lib/postgresql/data
    networks: [clavia]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OpenFGA's schema, brought up to date before the server starts; exits when done.
  openfga-migrate:
    image: openfga/openfga:v1.22.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy
    networks: [clavia]

  openfga:
    image: openfga/openfga:v1.22.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      # The same throwaway as CLAVIA_FGA_API_KEY in e2e.env.
      OPENFGA_AUTHN_PRESHARED_KEYS: e2e-only-openfga-preshared-key
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "false"
      OPENFGA_CHECK_ITERATOR_CACHE_ENABLED: "false"
      OPENFGA_LIST_OBJECTS_ITERATOR_CACHE_ENABLED: "false"
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    networks: [clavia]
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  clavia:
  edge:

volumes:
  public:
