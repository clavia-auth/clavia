; The CA of the stack's certificate, for the calls Clavia makes to the applications it signs people in to (a
; back-channel logout, a webhook). libcurl in this image reads no environment variable for it; PHP's curl
; extension reads this one. Only the stack's own hosts are ever called here.
curl.cainfo = /ca/rootCA.pem
openssl.cafile = /ca/rootCA.pem
