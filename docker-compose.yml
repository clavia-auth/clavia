services:
  # ── Caddy — reverse proxy / TLS termination ──────────────────
  # Terminates mkcert TLS for auth.{CLAVIA_ROOT_DOMAIN} and
  # management.{CLAVIA_ROOT_DOMAIN}, serves the static assets itself and hands
  # everything else to PHP-FPM over FastCGI. The dashboard (the Next.js app in
  # the clavia-dashboard repository) runs on the host, `npm run dev` on port 3000.
  caddy:
    image: caddy:2-alpine
    container_name: clavia-caddy
    restart: unless-stopped
    ports:
      - "${CLAVIA_HTTP_PORT:-80}:80"
      - "${CLAVIA_HTTPS_PORT:-443}:443"
    environment:
      CLAVIA_ROOT_DOMAIN: ${CLAVIA_ROOT_DOMAIN:?set CLAVIA_ROOT_DOMAIN in .env}
      CLAVIA_DASHBOARD_UPSTREAM: ${CLAVIA_DASHBOARD_UPSTREAM:-host.docker.internal:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      # Same path as in the php container: Caddy resolves a request to a file
      # under /app/public and passes that path to PHP-FPM as SCRIPT_FILENAME.
      - ./public:/app/public:ro
      - caddy-data:/data
      - caddy-config:/config
    # The dashboard's dev server runs on the host, so Caddy reaches it through
    # the host gateway. extra_hosts makes host.docker.internal resolve on Linux
    # too, where it is not built in.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
    networks:
      - clavia-net
    # As in production (deploy/compose/compose.yaml): /healthz on the internal listener, through
    # Caddy to PHP-FPM, so healthy means serving. Not `caddy validate` on the mounted Caddyfile: a
    # checkout replaces that file, the single-file mount keeps the deleted one, and the check failed
    # while Caddy served on (it reads its configuration once, when it starts).
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PHP-FPM — the application ────────────────────────────────
  # Share-nothing: every request builds the application and throws it away.
  # Also where the tooling runs: `docker compose exec php bin/clavia …`,
  # `composer check` (see the Makefile).
  php:
    build: ./docker/php
    container_name: clavia-php
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    # The application reads /app/.env itself. These override it for the one
    # thing that differs inside the Compose network: services are reached by
    # name on their own ports, not through the ports published on the host.
    environment:
      CLAVIA_POSTGRES_HOST: db
      CLAVIA_POSTGRES_PORT: 5432
      CLAVIA_REDIS_HOST: redis
      CLAVIA_REDIS_PORT: 6379
      # Where the test suite finds its storage: the throwaway db-test database and
      # Redis database 1 — never the development data (see test/Support/TestEnvironment.php).
      CLAVIA_TEST_DATABASE_URL: postgresql://${CLAVIA_POSTGRES_USER:-clavia}:${CLAVIA_POSTGRES_PASSWORD:-clavia}@db-test:5432/${CLAVIA_POSTGRES_DB:-clavia}_test
      CLAVIA_TEST_REDIS_URL: redis://redis:6379/1
      # OpenFGA, the decision engine behind fine-grained authorization
      # (docs/design/fine-grained-authorization.md), reached by name with the key it starts with.
      # The test suite runs the DecisionEngine contract against it, in stores it makes and deletes.
      CLAVIA_FGA_URL: http://openfga:8080
      CLAVIA_FGA_API_KEY: ${CLAVIA_FGA_API_KEY:-development-only-openfga-key}
      CLAVIA_TEST_FGA_URL: http://openfga:8080
      CLAVIA_TEST_FGA_API_KEY: ${CLAVIA_FGA_API_KEY:-development-only-openfga-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-test:
        condition: service_healthy
    networks:
      - clavia-net

  db:
    image: postgres:17-alpine
    container_name: clavia-db
    # The image requires the plain POSTGRES_* names inside the container; the
    # CLAVIA_-prefixed keys are ours, so .env cannot collide with another
    # project's Postgres settings on the same machine.
    environment:
      POSTGRES_USER: ${CLAVIA_POSTGRES_USER:-clavia}
      POSTGRES_PASSWORD: ${CLAVIA_POSTGRES_PASSWORD:-clavia}
      POSTGRES_DB: ${CLAVIA_POSTGRES_DB:-clavia}
    ports:
      - "${CLAVIA_POSTGRES_PORT:-5433}:5432"
    volumes:
      - clavia-pgdata:/var/lib/postgresql/data
    networks:
      - clavia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLAVIA_POSTGRES_USER:-clavia} -d ${CLAVIA_POSTGRES_DB:-clavia}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Sessions and the other short-TTL material described in CLAUDE.md
  # (failed-login counters, MFA challenges, social-login state, device codes).
  redis:
    image: redis:7-alpine
    container_name: clavia-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${CLAVIA_REDIS_PORT:-6379}:6379"
    volumes:
      - clavia-redisdata:/data
    networks:
      - clavia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Separate database for the test suite so it never touches dev data.
  # The database name is the dev one with a _test suffix, so the two stay in step
  # when CLAVIA_POSTGRES_DB is overridden.
  db-test:
    image: postgres:17-alpine
    container_name: clavia-db-test
    environment:
      POSTGRES_USER: ${CLAVIA_POSTGRES_USER:-clavia}
      POSTGRES_PASSWORD: ${CLAVIA_POSTGRES_PASSWORD:-clavia}
      POSTGRES_DB: ${CLAVIA_POSTGRES_DB:-clavia}_test
    ports:
      - "${CLAVIA_POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data  # ephemeral: tests start from a clean slate
    networks:
      - clavia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLAVIA_POSTGRES_USER:-clavia} -d ${CLAVIA_POSTGRES_DB:-clavia}_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  # ── OpenFGA — the decision engine of fine-grained authorization ──
  # Beside Clavia with its own database: the relationship graph never enters Clavia's
  # (docs/design/fine-grained-authorization.md §2). Reached by Clavia alone, with a preshared
  # key, and published on no port of the host. Every cache is off, so every answer is strongly
  # consistent: a revoked relationship is never answered from a stale copy.
  openfga-db:
    image: postgres:17-alpine
    container_name: clavia-openfga-db
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    volumes:
      - clavia-openfga-pgdata:/var/lib/postgresql/data
    networks:
      - clavia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 2s
      timeout: 3s
      retries: 20

  # OpenFGA's schema, brought up to date before the server starts; exits when done.
  openfga-migrate:
    image: openfga/openfga:v1.22.1
    container_name: clavia-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy
    networks:
      - clavia-net

  openfga:
    image: openfga/openfga:v1.22.1
    container_name: clavia-openfga
    restart: unless-stopped
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${CLAVIA_FGA_API_KEY:-development-only-openfga-key}
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "false"
      OPENFGA_CHECK_ITERATOR_CACHE_ENABLED: "false"
      OPENFGA_LIST_OBJECTS_ITERATOR_CACHE_ENABLED: "false"
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    networks:
      - clavia-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  clavia-net:
    driver: bridge

volumes:
  clavia-openfga-pgdata:
  clavia-pgdata:
  clavia-redisdata:
  caddy-data:
  caddy-config:
