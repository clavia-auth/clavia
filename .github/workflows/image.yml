name: Image

# The container image a release publishes is built here too, without pushing it, whenever something
# that goes into it changes: a release then never meets a Dockerfile that was not built before.
on:
  push:
    branches: [main]
    paths:
      - 'docker/php/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/image.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'docker/php/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/image.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  build:
    name: Production image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/php
          build-contexts: app=.
          target: production
          load: true
          push: false
          tags: clavia:ci

      # The application is in the image and starts: the console boots the container and reads its
      # configuration from the environment, and the Management API's contract is part of it.
      - name: The application is in the image
        run: |
          docker run --rm -e CLAVIA_ROOT_DOMAIN=ci.test clavia:ci php bin/clavia config
          docker run --rm clavia:ci test -f /app/docs/openapi/management-api.yaml
          docker run --rm clavia:ci sh -c '! test -e /app/vendor/bin/phpunit'
