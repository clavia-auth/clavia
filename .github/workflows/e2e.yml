name: End to end

# Clavia as it is deployed (docs/design/end-to-end-scenarios.md): the production topology of
# test/e2e/compose.yaml, built from this pull request, started and checked from outside over HTTPS.
# Behat then drives it from outside (test/e2e/features); the dashboard's Playwright suite joins it in the
# dashboard's own workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    name: The stack starts, and the scenarios pass against it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The dashboard as main has it (ghcr.io/clavia-auth/clavia-dashboard:edge), behind /dashboard.
      CLAVIA_E2E_DASHBOARD: "1"

    steps:
      - uses: actions/checkout@v7

      # A certificate for *.clavia.test from a CA made on this runner and trusted nowhere else.
      - name: Install mkcert
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mkcert

      # What a browser will need in the slices that follow; verify.sh does not.
      - name: Resolve the stack's names
        run: echo '127.0.0.1 clavia.test auth.clavia.test management.clavia.test' | sudo tee -a /etc/hosts

      - name: Start the stack
        run: test/e2e/up.sh

      - name: Check it answers
        run: test/e2e/verify.sh

      # PHP and the dev dependencies only to run Behat: the stack itself is in containers.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, curl, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Scenarios
        run: composer e2e

      - name: Scenario results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat
          path: build/behat
          retention-days: 7

      - name: Server logs
        if: failure()
        run: docker compose -f test/e2e/compose.yaml logs --no-color

      - name: Stop the stack
        if: always()
        run: test/e2e/down.sh
