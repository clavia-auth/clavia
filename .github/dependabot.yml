# Weekly update pull requests, grouped so a week's updates are one review.
# Major versions of packages are planned as issues (they need migration work), so only minor
# and patch updates come from here. php-db/* is pinned on purpose (CLAUDE.md, "Known issues").
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["area: operations"]
    ignore:
      - dependency-name: "php-db/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["area: operations"]
    groups:
      actions:
        patterns: ["*"]
